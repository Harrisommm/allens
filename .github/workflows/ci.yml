name: expo-smoke

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke:
    name: Expo bundle smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Verify EXPO_TOKEN is configured
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Missing EXPO_TOKEN secret. Follow https://docs.expo.dev/eas-update/github-actions/#publish-previews-on-pull-requests to create one."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.20.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/allens-expo/pnpm-lock.yaml

      - name: Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies (app workspace)
        run: pnpm --dir apps/allens-expo install --frozen-lockfile

      - name: Bundle (android dev)
        working-directory: apps/allens-expo
        run: |
          set -eux
          pnpm exec expo export --platform android --output-dir /tmp/expo-export --dev --force

      - name: Upload export artifact (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: expo-export-logs
          path: /tmp/expo-export/**/*
