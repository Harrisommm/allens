name: expo-ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  bundle:
    name: Expo export smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    steps:
      - name: Check EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Missing EXPO_TOKEN secret. See https://docs.expo.dev/eas-update/github-actions/."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.20.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/allens-expo/pnpm-lock.yaml

      - name: Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          packager: pnpm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install deps (app workspace)
        run: pnpm --dir apps/allens-expo install --frozen-lockfile

      - name: Typecheck
        working-directory: apps/allens-expo
        run: pnpm run typecheck

      - name: Allergen matcher self-check
        working-directory: apps/allens-expo
        run: pnpm run check

      - name: Export bundle (android dev)
        working-directory: apps/allens-expo
        run: |
          set -eux
          pnpm exec expo export --platform android --dev --output-dir /tmp/expo-export

      - name: Upload export artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: expo-export-debug
          path: /tmp/expo-export
