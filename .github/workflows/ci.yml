name: expo-smoke

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke:
    name: Expo dev server smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_LOG: /tmp/expo.log
      EXPO_PID: /tmp/expo.pid

    steps:
      - name: Verify EXPO_TOKEN is configured
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Missing EXPO_TOKEN secret. Follow https://docs.expo.dev/eas-update/github-actions/#publish-previews-on-pull-requests to create one."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.20.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/allens-expo/pnpm-lock.yaml

      - name: Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies (app workspace)
        run: pnpm --dir apps/allens-expo install --frozen-lockfile

      - name: Launch Expo dev server (background)
        working-directory: apps/allens-expo
        run: |
          set -eux
          : > "$EXPO_LOG"
          CI=1 pnpm exec expo start --offline --dev-client --max-workers 1 > "$EXPO_LOG" 2>&1 &
          echo $! > "$EXPO_PID"
          sleep 5
          # fail fast if expo died immediately
          if ! ps -p "$(cat "$EXPO_PID")" > /dev/null 2>&1; then
            echo "Expo process died during launch"
            cat "$EXPO_LOG"
            exit 1
          fi

      - name: Wait for Expo to report ready state
        working-directory: apps/allens-expo
        run: |
          set -eux
          if [ ! -f "$EXPO_LOG" ] || [ ! -f "$EXPO_PID" ]; then
            echo "Expo log or pid file missing"
            ls -l "$EXPO_LOG" "$EXPO_PID" || true
            exit 1
          fi
          for i in $(seq 1 40); do
            if grep -q "Waiting on http://localhost" "$EXPO_LOG" || grep -q "Tunnel ready" "$EXPO_LOG"; then
              exit 0
            fi
            if ! ps -p "$(cat "$EXPO_PID")" > /dev/null 2>&1; then
              echo "Expo process exited early"
              cat "$EXPO_LOG"
              exit 1
            fi
            sleep 2
          done
          echo "Expo server did not report ready state within timeout"
          cat "$EXPO_LOG"
          exit 1

      - name: Stop Expo dev server
        if: always()
        working-directory: apps/allens-expo
        run: |
          if [ -f "$EXPO_PID" ]; then
            kill "$(cat "$EXPO_PID")" || true
          fi
          if [ -f "$EXPO_LOG" ]; then
            echo "----- Expo log -----"
            cat "$EXPO_LOG"
          fi
